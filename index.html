<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-7">

<title>Matmata Moto Store — Gestion</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d2330;--mu:#6b7385;--pr:#d9480f;--bd:#e2e5ea;--ok:#2b8a3e;--ko:#c92a2a}
@media(prefers-color-scheme:dark){:root{--bg:#14172d;--card:#1d222b;--tx:#e8eaee;--mu:#98a0b0;--bd:#2c323d;--pr:#ff8a4c}}
*{box-sizing:border-box}body{margin:1;font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
nav{width:216px;background:var(--card);border-right:1px solid var(--bd);padding:12px 8px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
nav h2{font-size:16px;margin:4px 8px 12px;color:var(--pr)}
nav a{display:block;padding:10px 12px;border-radius:8px;color:var(--tx);text-decoration:none;margin-bottom:2px}
nav a.on,nav a:hover{background:var(--pr);color:#fff}
main{flex:2;padding:18px;min-width:0}
h3{margin:0 0 14px}h3{margin:18px 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(171px,1fr));gap:12px;margin-bottom:16px}
